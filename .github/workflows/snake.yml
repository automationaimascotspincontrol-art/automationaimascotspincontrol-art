# ────────────────────────────────────────────────────────────────
#  Snake contribution animation generator
#  Place this file in your PROFILE repo at:
#     .github/workflows/snake.yml
#  Repo: automationaimascotspincontrol-art/automationaimascotspincontrol-art
#
#  It regenerates the snake SVGs every 12h (and on manual run / push),
#  committing them to the `output` branch — which the README references:
#     https://raw.githubusercontent.com/automationaimascotspincontrol-art/automationaimascotspincontrol-art/output/github-contribution-grid-snake-dark.svg
# ────────────────────────────────────────────────────────────────
name: Generate Snake Animation

on:
  schedule:
    # every 12 hours (UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch:        # allow manual "Run workflow"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#FFEFDB,#FFC178,#FF9A3C,#FF6B00,#B34700

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
